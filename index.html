<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Outruling FPS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }

  /* HUD */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  #crosshair {
    position: absolute;
    left: 50%; top: 50%;
    width: 18px; height: 18px;
    margin-left: -9px; margin-top: -9px;
    transform: translateZ(0);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #ff4655;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  #dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 3px; height: 3px;
    margin-left: -1.5px; margin-top: -1.5px;
    background: #fff;
    border-radius: 50%;
  }

  #hitmark {
    position: absolute;
    left: 50%; top: 50%;
    width: 30px; height: 30px;
    margin-left: -15px; margin-top: -15px;
    opacity: 0;
    transition: opacity 120ms ease-out;
  }
  #hitmark::before, #hitmark::after {
    content: ''; position: absolute; background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #hitmark::before {
    top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px;
    transform: rotate(45deg);
  }
  #hitmark::after {
    top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px;
    transform: rotate(-45deg);
  }
  #hitmark.show { opacity: 1; }

  #stats {
    position: absolute;
    left: 24px; bottom: 24px;
    display: flex; gap: 18px;
    font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .stat {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px;
    border-radius: 6px;
    min-width: 80px;
    backdrop-filter: blur(4px);
  }
  .stat .label {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.7;
    font-weight: 500;
  }
  .stat .value {
    font-size: 22px;
    color: #fff;
  }
  .stat.health .value { color: #6dffb0; }
  .stat.ammo .value { color: #ffd166; }
  .stat.kills .value { color: #ff4655; }

  #damage {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, transparent 50%, rgba(255,40,40,0.55) 100%);
    opacity: 0;
    transition: opacity 200ms ease-out;
  }
  #damage.hit { opacity: 1; }

  #killfeed {
    position: absolute;
    right: 24px; top: 24px;
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-end;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .kill {
    background: rgba(0,0,0,0.5);
    border-left: 3px solid #ff4655;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 600;
    animation: fade 3s forwards;
  }
  @keyframes fade {
    0% { opacity: 0; transform: translateX(20px); }
    10% { opacity: 1; transform: translateX(0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Menu / overlay */
  #menu {
    position: fixed; inset: 0;
    background: rgba(10, 12, 16, 0.85);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #menu.hidden { display: none; }
  #menu .panel {
    text-align: center;
    padding: 40px 60px;
    border: 1px solid rgba(255, 70, 85, 0.3);
    border-radius: 4px;
    background: rgba(20, 22, 28, 0.85);
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  }
  #menu h1 {
    margin: 0 0 8px;
    font-size: 56px;
    letter-spacing: 6px;
    color: #ff4655;
    font-weight: 900;
  }
  #menu p {
    margin: 6px 0;
    opacity: 0.85;
    font-size: 14px;
    letter-spacing: 1px;
  }
  #menu .controls {
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 18px;
    margin: 24px 0;
    font-size: 13px;
    opacity: 0.85;
    text-align: left;
  }
  #menu .key {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    text-align: center;
  }
  #menu button {
    margin-top: 10px;
    background: #ff4655;
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 100ms, background 100ms;
  }
  #menu button:hover {
    background: #ff5e6c;
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="dot"></div>
    <div id="hitmark"></div>
    <div id="damage"></div>

    <div id="killfeed"></div>

    <div id="stats">
      <div class="stat health">
        <div class="label">HEALTH</div>
        <div class="value" id="healthVal">100</div>
      </div>
      <div class="stat ammo">
        <div class="label">AMMO</div>
        <div class="value" id="ammoVal">30 / 90</div>
      </div>
      <div class="stat kills">
        <div class="label">KILLS</div>
        <div class="value" id="killsVal">0</div>
      </div>
    </div>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>OUTRULING</h1>
      <p>Eliminate the bots. Stay alive.</p>
      <div class="controls">
        <span><span class="key">WASD</span></span><span>Move</span>
        <span><span class="key">Mouse</span></span><span>Look</span>
        <span><span class="key">Arrows</span></span><span>Look (trackpad)</span>
        <span><span class="key">Click / F</span></span><span>Shoot</span>
        <span><span class="key">Space</span></span><span>Jump</span>
        <span><span class="key">Shift</span></span><span>Sprint</span>
        <span><span class="key">R</span></span><span>Reload</span>
        <span><span class="key">Esc</span></span><span>Pause</span>
      </div>
      <button id="playBtn">PLAY</button>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// CONFIG
// ============================================================
const PLAYER = {
  height: 1.7,
  radius: 0.35,
  speed: 6.0,
  sprintMult: 1.5,
  jumpVel: 7.5,
  gravity: 22.0,
  maxHealth: 100,
};
const GUN = {
  damage: 28,
  fireRate: 0.09, // seconds between shots
  magSize: 30,
  reserve: 90,
  reloadTime: 1.6,
  spread: 0.012,
  range: 200,
};
const BOT = {
  height: 1.7,
  radius: 0.35,
  speed: 2.6,
  health: 100,
  attackRange: 30,
  fireRate: 0.6,
  damage: 8,
  sightFOV: Math.PI * 0.7, // 126 degrees
};
const NUM_BOTS = 6;
const ARENA = 50; // half-extent

// ============================================================
// SETUP
// ============================================================
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d24);
scene.fog = new THREE.Fog(0x1a1d24, 40, 120);

const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.05, 500);

// player rig: yaw object holds pitch object holds camera
const yawObject = new THREE.Object3D();
const pitchObject = new THREE.Object3D();
pitchObject.add(camera);
yawObject.add(pitchObject);
yawObject.position.set(0, PLAYER.height, 10);
scene.add(yawObject);

// ============================================================
// LIGHTING
// ============================================================
const hemi = new THREE.HemisphereLight(0xa6c8ff, 0x2a2418, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d4, 1.1);
sun.position.set(40, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -ARENA;
sun.shadow.camera.right = ARENA;
sun.shadow.camera.top = ARENA;
sun.shadow.camera.bottom = -ARENA;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ============================================================
// MAP
// ============================================================
const colliders = []; // axis-aligned boxes for collision: {min, max}

function addBox(x, y, z, sx, sy, sz, color, opts = {}) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.85,
    metalness: opts.metalness ?? 0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  colliders.push({
    min: new THREE.Vector3(x - sx / 2, y - sy / 2, z - sz / 2),
    max: new THREE.Vector3(x + sx / 2, y + sy / 2, z + sz / 2),
  });
  return mesh;
}

// ground (no collider; we use floor=0)
const groundGeo = new THREE.PlaneGeometry(ARENA * 2, ARENA * 2);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2c3038, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// grid pattern lines on ground
const grid = new THREE.GridHelper(ARENA * 2, 40, 0x444a55, 0x363b44);
grid.position.y = 0.01;
scene.add(grid);

// outer walls
const wallH = 4;
addBox(0, wallH / 2,  ARENA, ARENA * 2, wallH, 1, 0x4a5060);
addBox(0, wallH / 2, -ARENA, ARENA * 2, wallH, 1, 0x4a5060);
addBox( ARENA, wallH / 2, 0, 1, wallH, ARENA * 2, 0x4a5060);
addBox(-ARENA, wallH / 2, 0, 1, wallH, ARENA * 2, 0x4a5060);

// cover blocks scattered around
const coverPositions = [
  [-12, 0, -8, 4, 2, 4, 0xff4655],
  [ 14, 0,  6, 6, 2.5, 2, 0x4a5060],
  [  0, 0, -20, 8, 2, 2, 0x6b7180],
  [ -6, 0, 14, 2, 1.4, 6, 0xff4655],
  [ 22, 0, -16, 3, 3, 3, 0x4a5060],
  [-22, 0, 18, 5, 1.6, 2, 0x6b7180],
  [-25, 0, -22, 2, 2.4, 8, 0x4a5060],
  [ 18, 0, 22, 4, 1.2, 4, 0xff4655],
  [  6, 0,  0, 1.5, 2, 1.5, 0x6b7180],
  [-14, 0,  0, 1.5, 2, 1.5, 0x6b7180],
  [ 30, 0,  0, 2, 2, 6, 0x4a5060],
  [-30, 0,  4, 2, 2, 6, 0x4a5060],
];
for (const [x, _, z, sx, sy, sz, color] of coverPositions) {
  addBox(x, sy / 2, z, sx, sy, sz, color);
}

// some tall pillars
for (const [x, z] of [[-35, -35], [35, 35], [-35, 35], [35, -35]]) {
  addBox(x, 1.5, z, 2, 3, 2, 0x55606f);
}

// ============================================================
// BULLETS / TRACERS
// ============================================================
const tracers = []; // { line, life, ttl }

function spawnTracer(from, to, color = 0xfff0a8) {
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ line, life: 0, ttl: 0.08 });
}

const impactPool = [];
function spawnImpact(point, normal, color = 0xffaa55) {
  const geo = new THREE.SphereGeometry(0.08, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(point).addScaledVector(normal, 0.05);
  scene.add(m);
  impactPool.push({ mesh: m, life: 0, ttl: 0.4 });
}

// ============================================================
// BOTS
// ============================================================
const bots = [];

function makeBot(x, z) {
  const group = new THREE.Group();

  // body capsule (cylinder + sphere caps – very minimal)
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4655, roughness: 0.5, metalness: 0.2 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffd1d4, roughness: 0.6 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 1.2, 12), bodyMat);
  body.position.y = 0.6 + 0.3;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), headMat);
  head.position.y = 1.55;
  head.castShadow = true;
  group.add(head);

  // a tiny gun bar
  const gun = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.1, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x222, roughness: 0.4, metalness: 0.7 })
  );
  gun.position.set(0.25, 1.1, 0.35);
  group.add(gun);

  group.position.set(x, 0, z);
  scene.add(group);

  return {
    group, body, head, gun,
    pos: group.position,
    vel: new THREE.Vector3(),
    health: BOT.health,
    alive: true,
    target: new THREE.Vector3(x, 0, z),
    nextRetarget: 0,
    fireCooldown: Math.random() * 1.5,
    state: 'patrol', // patrol | attack
    respawnTimer: 0,
  };
}

function spawnBotAtRandomPoint(bot) {
  for (let i = 0; i < 30; i++) {
    const x = (Math.random() - 0.5) * (ARENA * 2 - 6);
    const z = (Math.random() - 0.5) * (ARENA * 2 - 6);
    const p = new THREE.Vector3(x, PLAYER.height, z);
    // ensure not inside a collider and not too close to player
    if (yawObject.position.distanceTo(p) < 12) continue;
    if (positionBlocked(x, z, BOT.radius + 0.2)) continue;
    bot.pos.set(x, 0, z);
    bot.health = BOT.health;
    bot.alive = true;
    bot.group.visible = true;
    bot.state = 'patrol';
    bot.fireCooldown = 0.5;
    return;
  }
}

for (let i = 0; i < NUM_BOTS; i++) {
  const bot = makeBot(0, 0);
  bots.push(bot);
  spawnBotAtRandomPoint(bot);
}

// ============================================================
// COLLISION
// ============================================================
function positionBlocked(x, z, radius) {
  for (const c of colliders) {
    // expand collider by radius (XZ only) and test whether (x,z) is inside, ignoring Y because we treat colliders as full walls
    if (
      x > c.min.x - radius && x < c.max.x + radius &&
      z > c.min.z - radius && z < c.max.z + radius
    ) {
      // also require the box to extend high enough to matter
      if (c.max.y > 0.2) return true;
    }
  }
  return false;
}

// move with slide along walls – axis separated
function moveWithCollision(obj, dx, dz, radius) {
  let nx = obj.position.x + dx;
  if (!positionBlocked(nx, obj.position.z, radius)) obj.position.x = nx;
  let nz = obj.position.z + dz;
  if (!positionBlocked(obj.position.x, nz, radius)) obj.position.z = nz;
  // arena bounds
  obj.position.x = Math.max(-ARENA + radius, Math.min(ARENA - radius, obj.position.x));
  obj.position.z = Math.max(-ARENA + radius, Math.min(ARENA - radius, obj.position.z));
}

// ============================================================
// INPUT
// ============================================================
const keys = Object.create(null);
let pointerLocked = false;
const SENS = 0.004;       // pointer-lock sensitivity (bumped for trackpads)
const ARROW_TURN = 2.6;   // radians/sec when arrow keys held

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') tryReload();
  if (e.code === 'KeyF') state.firing = true; // alt-fire key
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'Escape' && state.alive && !state.gameOver) showMenu(true);
});
document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (e.code === 'KeyF') state.firing = false;
});

function clampPitch() {
  pitchObject.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitchObject.rotation.x));
}

renderer.domElement.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  yawObject.rotation.y -= e.movementX * SENS;
  pitchObject.rotation.x -= e.movementY * SENS;
  clampPitch();
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  state.firing = true;
  // try to grab pointer lock if not already locked (re-request on click)
  if (!pointerLocked && state.alive && !state.gameOver) {
    renderer.domElement.requestPointerLock?.();
  }
});
renderer.domElement.addEventListener('mouseup', (e) => {
  if (e.button === 0) state.firing = false;
});

// ============================================================
// GAME STATE
// ============================================================
const state = {
  vy: 0,
  onGround: true,
  alive: true,
  health: PLAYER.maxHealth,
  ammo: GUN.magSize,
  reserve: GUN.reserve,
  reloading: false,
  reloadEnd: 0,
  lastShot: 0,
  firing: false,
  kills: 0,
  gameOver: false,
  time: 0,
};

// ============================================================
// HUD
// ============================================================
const elHealth = document.getElementById('healthVal');
const elAmmo = document.getElementById('ammoVal');
const elKills = document.getElementById('killsVal');
const elHitmark = document.getElementById('hitmark');
const elDamage = document.getElementById('damage');
const elKillfeed = document.getElementById('killfeed');
const elMenu = document.getElementById('menu');
const elPlay = document.getElementById('playBtn');

function updateHUD() {
  elHealth.textContent = Math.max(0, Math.round(state.health));
  elAmmo.textContent = state.reloading ? 'RELOADING' : `${state.ammo} / ${state.reserve}`;
  elKills.textContent = state.kills;
}
updateHUD();

function flashHitmark() {
  elHitmark.classList.add('show');
  clearTimeout(flashHitmark._t);
  flashHitmark._t = setTimeout(() => elHitmark.classList.remove('show'), 120);
}
function flashDamage() {
  elDamage.classList.add('hit');
  clearTimeout(flashDamage._t);
  flashDamage._t = setTimeout(() => elDamage.classList.remove('hit'), 220);
}
function pushKillfeed(text) {
  const div = document.createElement('div');
  div.className = 'kill';
  div.textContent = text;
  elKillfeed.appendChild(div);
  setTimeout(() => div.remove(), 3100);
}

function showMenu(paused = false) {
  const panel = elMenu.querySelector('.panel');
  const h1 = panel.querySelector('h1');
  const p = panel.querySelector('p');
  if (state.gameOver) {
    h1.textContent = 'YOU DIED';
    p.textContent = `Kills: ${state.kills}. Click play to respawn.`;
    elPlay.textContent = 'RESPAWN';
  } else if (paused) {
    h1.textContent = 'PAUSED';
    p.textContent = 'Click resume to keep playing.';
    elPlay.textContent = 'RESUME';
  } else {
    h1.textContent = 'OUTRULING';
    p.textContent = 'Eliminate the bots. Stay alive.';
    elPlay.textContent = 'PLAY';
  }
  elMenu.classList.remove('hidden');
}
function hideMenu() {
  elMenu.classList.add('hidden');
}

elPlay.addEventListener('click', () => {
  if (state.gameOver) {
    // full reset
    state.alive = true;
    state.gameOver = false;
    state.health = PLAYER.maxHealth;
    state.ammo = GUN.magSize;
    state.reserve = GUN.reserve;
    state.reloading = false;
    state.kills = 0;
    yawObject.position.set(0, PLAYER.height, 10);
    state.vy = 0;
    for (const b of bots) spawnBotAtRandomPoint(b);
    updateHUD();
  }
  hideMenu();
  renderer.domElement.requestPointerLock();
});

// ============================================================
// SHOOTING
// ============================================================
const raycaster = new THREE.Raycaster();
raycaster.far = GUN.range;

function tryReload() {
  if (state.reloading) return;
  if (state.ammo === GUN.magSize) return;
  if (state.reserve <= 0) return;
  state.reloading = true;
  state.reloadEnd = state.time + GUN.reloadTime;
  updateHUD();
}

function finishReload() {
  const need = GUN.magSize - state.ammo;
  const take = Math.min(need, state.reserve);
  state.ammo += take;
  state.reserve -= take;
  state.reloading = false;
  updateHUD();
}

function tryShoot() {
  if (!state.alive) return;
  if (state.reloading) return;
  if (state.time - state.lastShot < GUN.fireRate) return;
  if (state.ammo <= 0) {
    tryReload();
    return;
  }
  state.lastShot = state.time;
  state.ammo--;
  updateHUD();

  // muzzle origin slightly below crosshair
  const origin = new THREE.Vector3();
  camera.getWorldPosition(origin);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  // spread
  dir.x += (Math.random() - 0.5) * GUN.spread * 2;
  dir.y += (Math.random() - 0.5) * GUN.spread * 2;
  dir.z += (Math.random() - 0.5) * GUN.spread * 2;
  dir.normalize();

  raycaster.set(origin, dir);

  // collect targets: bot meshes + scene environment (excluding tracers/grid)
  const botMeshes = [];
  for (const b of bots) {
    if (!b.alive) continue;
    botMeshes.push(b.body);
    botMeshes.push(b.head);
  }
  const envHits = raycaster.intersectObjects(scene.children, true).filter(h => {
    if (h.object === ground) return true;
    if (h.object.isLine) return false;
    if (h.object === grid) return false;
    return true;
  });

  // find first bot hit AND first env hit, pick closest
  let firstBot = null;
  let firstEnv = null;
  for (const h of envHits) {
    if (botMeshes.includes(h.object)) {
      if (!firstBot || h.distance < firstBot.distance) firstBot = h;
    } else {
      if (!firstEnv || h.distance < firstEnv.distance) firstEnv = h;
    }
  }

  let hitDist = GUN.range;
  let hitPoint = origin.clone().addScaledVector(dir, GUN.range);
  let hitNormal = dir.clone().multiplyScalar(-1);
  let hitColor = 0xffaa55;

  // Choose nearest among bot/env
  let chosen = null;
  if (firstBot && (!firstEnv || firstBot.distance <= firstEnv.distance)) {
    chosen = { type: 'bot', hit: firstBot };
  } else if (firstEnv) {
    chosen = { type: 'env', hit: firstEnv };
  }

  if (chosen) {
    hitDist = chosen.hit.distance;
    hitPoint = chosen.hit.point.clone();
    hitNormal = chosen.hit.face ? chosen.hit.face.normal.clone() : dir.clone().multiplyScalar(-1);

    if (chosen.type === 'bot') {
      // find which bot
      const mesh = chosen.hit.object;
      const bot = bots.find(b => b.alive && (b.body === mesh || b.head === mesh));
      if (bot) {
        const isHead = mesh === bot.head;
        const dmg = isHead ? GUN.damage * 2.2 : GUN.damage;
        bot.health -= dmg;
        flashHitmark();
        hitColor = isHead ? 0xff5577 : 0xffd166;
        if (bot.health <= 0) {
          killBot(bot, isHead);
        }
      }
    }
  }

  // tracer from a small offset (gun-ish)
  const muzzle = origin.clone();
  // offset down/right relative to camera
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const down = new THREE.Vector3(0, -1, 0).applyQuaternion(camera.quaternion);
  muzzle.addScaledVector(right, 0.18).addScaledVector(down, 0.18);
  spawnTracer(muzzle, hitPoint, 0xfff0a8);
  spawnImpact(hitPoint, hitNormal, hitColor);

  // recoil kick
  pitchObject.rotation.x += 0.006 + Math.random() * 0.004;
}

function killBot(bot, headshot) {
  bot.alive = false;
  bot.group.visible = false;
  state.kills++;
  pushKillfeed((headshot ? 'HEADSHOT  ' : '') + 'YOU eliminated BOT');
  updateHUD();
  bot.respawnTimer = 4 + Math.random() * 3;
}

// ============================================================
// BOT AI
// ============================================================
function botCanSeePlayer(bot) {
  const eye = new THREE.Vector3(bot.pos.x, 1.5, bot.pos.z);
  const playerPos = yawObject.position.clone();
  const toPlayer = playerPos.clone().sub(eye);
  const dist = toPlayer.length();
  if (dist > BOT.attackRange) return false;
  toPlayer.normalize();

  raycaster.far = dist + 0.1;
  raycaster.set(eye, toPlayer);
  const hits = raycaster.intersectObjects(scene.children, true).filter(h => {
    if (h.object.isLine) return false;
    if (h.object === ground || h.object === grid) return false;
    // ignore self
    if (h.object === bot.body || h.object === bot.head || h.object === bot.gun) return false;
    // ignore other bots' bodies (they don't block sight)
    for (const ob of bots) {
      if (ob !== bot && (h.object === ob.body || h.object === ob.head || h.object === ob.gun)) return false;
    }
    return true;
  });
  raycaster.far = GUN.range;

  if (hits.length === 0) return true;
  return hits[0].distance >= dist - 0.1;
}

function pickPatrolTarget(bot) {
  for (let i = 0; i < 20; i++) {
    const x = bot.pos.x + (Math.random() - 0.5) * 24;
    const z = bot.pos.z + (Math.random() - 0.5) * 24;
    if (Math.abs(x) > ARENA - 2 || Math.abs(z) > ARENA - 2) continue;
    if (!positionBlocked(x, z, BOT.radius + 0.2)) {
      bot.target.set(x, 0, z);
      return;
    }
  }
  bot.target.set(0, 0, 0);
}

function updateBot(bot, dt) {
  if (!bot.alive) {
    bot.respawnTimer -= dt;
    if (bot.respawnTimer <= 0) spawnBotAtRandomPoint(bot);
    return;
  }

  const sees = botCanSeePlayer(bot);
  if (sees) bot.state = 'attack';
  else if (bot.state === 'attack') {
    // lose interest after a short while
    bot.nextRetarget = 0;
    bot.state = 'patrol';
  }

  let moveDir = new THREE.Vector3();

  if (bot.state === 'attack' && state.alive) {
    // strafe / approach toward player
    const toPlayer = yawObject.position.clone().sub(bot.pos);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();
    // keep distance ~ 12 units
    if (dist > 14) moveDir.copy(toPlayer);
    else if (dist < 8) moveDir.copy(toPlayer).multiplyScalar(-1);
    else {
      // strafe
      const strafe = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x);
      moveDir.copy(strafe).multiplyScalar(Math.sin(state.time * 1.8 + bot.pos.x) > 0 ? 1 : -1);
    }

    // face player
    const lookAng = Math.atan2(toPlayer.x, toPlayer.z);
    bot.group.rotation.y = lookAng;

    // shoot
    bot.fireCooldown -= dt;
    if (bot.fireCooldown <= 0 && sees) {
      bot.fireCooldown = BOT.fireRate * (0.85 + Math.random() * 0.4);
      botShoot(bot);
    }
  } else {
    // patrol
    bot.nextRetarget -= dt;
    const distToTarget = Math.hypot(bot.pos.x - bot.target.x, bot.pos.z - bot.target.z);
    if (bot.nextRetarget <= 0 || distToTarget < 1.0) {
      pickPatrolTarget(bot);
      bot.nextRetarget = 3 + Math.random() * 3;
    }
    const dx = bot.target.x - bot.pos.x;
    const dz = bot.target.z - bot.pos.z;
    const len = Math.hypot(dx, dz);
    if (len > 0.01) {
      moveDir.set(dx / len, 0, dz / len);
      bot.group.rotation.y = Math.atan2(dx, dz);
    }
  }

  if (moveDir.lengthSq() > 0) {
    const speed = BOT.speed * (bot.state === 'attack' ? 1.1 : 1);
    const dx = moveDir.x * speed * dt;
    const dz = moveDir.z * speed * dt;
    moveWithCollision(bot.group, dx, dz, BOT.radius);
  }
}

function botShoot(bot) {
  const eye = new THREE.Vector3(bot.pos.x, 1.4, bot.pos.z);
  // aim toward player chest with some inaccuracy
  const target = yawObject.position.clone();
  target.y -= 0.1;
  const dir = target.clone().sub(eye);
  const dist = dir.length();
  dir.normalize();
  // inaccuracy increases with distance
  const inacc = 0.04 + Math.min(0.12, dist * 0.004);
  dir.x += (Math.random() - 0.5) * inacc;
  dir.y += (Math.random() - 0.5) * inacc;
  dir.z += (Math.random() - 0.5) * inacc;
  dir.normalize();

  raycaster.set(eye, dir);
  const hits = raycaster.intersectObjects(scene.children, true).filter(h => {
    if (h.object.isLine) return false;
    if (h.object === ground || h.object === grid) return false;
    if (h.object === bot.body || h.object === bot.head || h.object === bot.gun) return false;
    return true;
  });

  let endPoint = eye.clone().addScaledVector(dir, BOT.attackRange);
  let hitPlayer = false;

  if (hits.length > 0) {
    const h = hits[0];
    endPoint = h.point.clone();
    // check whether we hit something between bot and player; player has no mesh,
    // so we instead test if ray's first env hit distance >= player distance
    const playerDist = yawObject.position.distanceTo(eye);
    if (h.distance >= playerDist - 0.4) {
      // close enough to player; treat as hit if dir is aligned
      const aim = yawObject.position.clone().sub(eye).normalize();
      if (dir.dot(aim) > 0.985) {
        hitPlayer = true;
        endPoint = yawObject.position.clone();
      }
    }
  } else {
    const aim = yawObject.position.clone().sub(eye).normalize();
    if (dir.dot(aim) > 0.985) {
      hitPlayer = true;
      endPoint = yawObject.position.clone();
    }
  }

  spawnTracer(eye, endPoint, 0xff6677);

  if (hitPlayer && state.alive) {
    state.health -= BOT.damage;
    flashDamage();
    updateHUD();
    if (state.health <= 0) {
      state.alive = false;
      state.gameOver = true;
      document.exitPointerLock();
      setTimeout(() => showMenu(false), 400);
    }
  }
}

// ============================================================
// PLAYER UPDATE
// ============================================================
const moveVec = new THREE.Vector3();

function updatePlayer(dt) {
  if (!state.alive) return;

  // movement
  const forward = new THREE.Vector3(
    -Math.sin(yawObject.rotation.y),
    0,
    -Math.cos(yawObject.rotation.y)
  );
  const right = new THREE.Vector3(
    Math.cos(yawObject.rotation.y),
    0,
    -Math.sin(yawObject.rotation.y)
  );

  moveVec.set(0, 0, 0);
  if (keys['KeyW']) moveVec.add(forward);
  if (keys['KeyS']) moveVec.sub(forward);
  if (keys['KeyD']) moveVec.add(right);
  if (keys['KeyA']) moveVec.sub(right);

  if (moveVec.lengthSq() > 0) moveVec.normalize();

  let speed = PLAYER.speed;
  if (keys['ShiftLeft'] || keys['ShiftRight']) speed *= PLAYER.sprintMult;

  const dx = moveVec.x * speed * dt;
  const dz = moveVec.z * speed * dt;
  moveWithCollision(yawObject, dx, dz, PLAYER.radius);

  // jump / gravity
  if (state.onGround && (keys['Space'])) {
    state.vy = PLAYER.jumpVel;
    state.onGround = false;
  }
  state.vy -= PLAYER.gravity * dt;
  yawObject.position.y += state.vy * dt;
  if (yawObject.position.y <= PLAYER.height) {
    yawObject.position.y = PLAYER.height;
    state.vy = 0;
    state.onGround = true;
  }

  // shooting
  if (state.firing) tryShoot();

  // reload finish
  if (state.reloading && state.time >= state.reloadEnd) finishReload();
}

// ============================================================
// VIEWMODEL (player gun)
// ============================================================
const viewmodel = new THREE.Group();
const gunBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.08, 0.1, 0.55),
  new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.45, metalness: 0.7 })
);
gunBody.position.set(0.18, -0.18, -0.45);
viewmodel.add(gunBody);
const gunBarrel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8),
  new THREE.MeshStandardMaterial({ color: 0x111418, roughness: 0.4, metalness: 0.85 })
);
gunBarrel.rotation.x = Math.PI / 2;
gunBarrel.position.set(0.18, -0.16, -0.7);
viewmodel.add(gunBarrel);
const gunGrip = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.16, 0.08),
  new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.6 })
);
gunGrip.position.set(0.18, -0.3, -0.32);
viewmodel.add(gunGrip);
camera.add(viewmodel);
scene.add(camera);

let muzzleFlashTime = 0;
const muzzleLight = new THREE.PointLight(0xffd06b, 0, 4, 2);
muzzleLight.position.set(0.18, -0.16, -0.9);
camera.add(muzzleLight);

// ============================================================
// LOOP
// ============================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  state.time += dt;

  if (state.alive && !state.gameOver) {
    updatePlayer(dt);

    // arrow keys to look (trackpad-friendly fallback)
    if (keys['ArrowLeft'])  yawObject.rotation.y += ARROW_TURN * dt;
    if (keys['ArrowRight']) yawObject.rotation.y -= ARROW_TURN * dt;
    if (keys['ArrowUp'])    pitchObject.rotation.x += ARROW_TURN * 0.7 * dt;
    if (keys['ArrowDown'])  pitchObject.rotation.x -= ARROW_TURN * 0.7 * dt;
    clampPitch();
  }

  // update bots
  for (const bot of bots) updateBot(bot, dt);

  // tracer life
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i];
    t.life += dt;
    t.line.material.opacity = Math.max(0, 0.9 * (1 - t.life / t.ttl));
    if (t.life >= t.ttl) {
      scene.remove(t.line);
      t.line.geometry.dispose();
      t.line.material.dispose();
      tracers.splice(i, 1);
    }
  }

  // impacts
  for (let i = impactPool.length - 1; i >= 0; i--) {
    const m = impactPool[i];
    m.life += dt;
    m.mesh.material.opacity = Math.max(0, 1 - m.life / m.ttl);
    m.mesh.scale.setScalar(1 + m.life * 4);
    if (m.life >= m.ttl) {
      scene.remove(m.mesh);
      m.mesh.geometry.dispose();
      m.mesh.material.dispose();
      impactPool.splice(i, 1);
    }
  }

  // muzzle flash
  if (state.time - state.lastShot < 0.05) {
    muzzleLight.intensity = 4;
  } else {
    muzzleLight.intensity *= 0.6;
  }

  // viewmodel sway / bob
  const moving = (keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD']) && state.onGround;
  const bob = moving ? Math.sin(state.time * 12) * 0.012 : 0;
  viewmodel.position.y = bob;
  viewmodel.position.x = (moving ? Math.sin(state.time * 6) * 0.006 : 0);

  // health regen (slow)
  if (state.alive && state.time % 1 < dt) {
    if (state.health < PLAYER.maxHealth) {
      state.health = Math.min(PLAYER.maxHealth, state.health + 1);
      updateHUD();
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
